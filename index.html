<style>
:root{--pk:#ff8fb1;--pd:#c2557d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:"Baloo 2","Nunito","Quicksand","Segoe UI",system-ui,sans-serif;color:#ffe4ef;background:#1a1218;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:manipulation}

.pixel-decor{position:absolute;z-index:1;width:10cqw;height:4.6cqh;padding:2px;background:#fffaf5;border:2px solid #fff;border-radius:8px;box-shadow:0 3px 0 rgba(90,58,74,.35),0 5px 8px rgba(90,58,74,.28);line-height:0;pointer-events:none}
.pixel-decor.left{left:5%;transform:rotate(-7deg)}
.pixel-decor.right{right:5%;transform:rotate(7deg)}
.pixel-decor.top-left{top:4%;left:5%;transform:rotate(-7deg)}
.pixel-decor.top-right{top:4%;right:5%;transform:rotate(7deg)}
.pixel-decor.left,.pixel-decor.right{width:7.5cqw;height:3.45cqh;padding:1px;border-radius:6px}
.pixel-decor.bottom-left{top:85%;left:5%;transform:rotate(-7deg)}
.pixel-decor.bottom-center-left{top:85%;left:25%;transform:rotate(5deg)}
.pixel-decor.bottom-center{top:85%;left:45%;transform:rotate(-4deg)}

.pixel-decor.bottom-right{top:85%;right:5%;transform:rotate(-5deg)}
.pixel-decor svg{display:block;width:100%;height:100%;shape-rendering:crispEdges}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:
 radial-gradient(circle at 7% 16%,transparent 0 10px,#e56b93 11px 13px,transparent 14px),
 radial-gradient(circle at 92% 12%,transparent 0 7px,#f4a0be 8px 10px,transparent 11px),
 radial-gradient(circle at 10% 78%,transparent 0 12px,#f4a0be 13px 15px,transparent 16px),
 radial-gradient(circle at 90% 84%,transparent 0 9px,#e56b93 10px 12px,transparent 13px)}
#app{position:relative;z-index:1;box-sizing:border-box;width:100%;height:100dvh;height:100svh;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#machine{position:relative;container-type:size;aspect-ratio:360/780;height:100%;width:auto;max-width:100%;max-height:100%;background:#1a1218}
#msg{position:absolute;z-index:2;left:10%;right:10%;top:23%;margin:0;padding:1cqh 1.4cqw;background:#fff8ee;border:3px solid #e23b6a;box-shadow:3px 3px 0 #c2557d;font-weight:800;font-size:2cqh;line-height:1.35;text-align:center;color:#14080e;pointer-events:none}

canvas#cv{width:100%;height:100%;display:block}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}

#pad .a{width:5.4cqh;height:5.4cqh;font-size:2cqh;color:#7a3050;background:#ffd0e2;box-shadow:0 .4cqh 0 #c45c78;border-radius:1.4cqh}

@keyframes blink{50%{opacity:.15}}

#bk{display:flex;align-items:center;justify-content:center;width:3.6cqh;height:3.1cqh;padding:0}

.spin{position:absolute;left:50%;top:178px;width:280px;height:280px;margin:-140px 0 0 -140px}

.got-r canvas{animation:inR .55s cubic-bezier(.2,1.6,.3,1)}

.got-s{animation:pop .35s cubic-bezier(.3,1.6,.5,1),secretCard .6s ease-in-out 3}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes shake{25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
@keyframes fl{to{transform:translate(var(--dx),-170px) scale(1.5);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ring{to{transform:scale(11);opacity:0}}

@media(max-height:500px){#info{font-size:1.45cqh;line-height:1.15;padding:.35cqh .8cqw}}

<script>
/* ====== CÁ NHÂN HÓA: sửa phần này là đủ ====== */
const CONFIG={
 name:"Công chúa",
 intro:"Anh làm riêng một cái máy gắp cho em nè. Hi vọng trò chơi này sẽ giúp em giải tỏa và thư giãn hơn mỗi khi em cảm thấy mệt mỏi!",
 secretMsg:"Capy bí mật nói nhỏ: Thu ơi, anh thương em nhiều lắm đó 💗",
 finalLetter:"Giỏi quá! Em đã sưu tầm đủ cả đội rồi! Mong rằng trò chơi này đã mang lại niềm vui cho em, bởi vì a rất thích nụ cười tỏa nắng của em 💌",
 rates:{s:5,r:25},   /* % ra bí mật, % ra hiếm; còn lại là thường */
 grip:0.5            /* độ dễ gắp: 0.3 khó, 0.7 dễ */
};
const CH=[
{n:"Chuột Hamster",file:"hamster.png",r:"c",m:"Hamster dúi Công chúa một hạt hướng dương!"},
{n:"Gà Con",file:"chicken.png",r:"c",m:"Chíp chíp! Gà Con chúc Công chúa một ngày thật vui."},
{n:"Heo Hồng",file:"pig.png",r:"c",m:"Ụt ụt~ Công chúa hôm nay cũng xinh quá à!"},
{n:"Cánh Cụt",file:"penguin.png",r:"c",m:"Cánh Cụt lạch bạch chạy tới ôm Công chúa!"},
{n:"Shiba",file:"shiba.png",r:"c",m:"Gâu! Shiba thích Công chúa nhất trên đời."},
{n:"Mèo Thần Tài",file:"luckycat.png",r:"c",m:"Mèo Thần Tài vẫy tay chúc Công chúa may mắn!"},
{n:"Llama",file:"llama.png",r:"c",m:"Llama ngoe nguẩy tai chào Công chúa!"},
{n:"Cáo Cam",file:"fox.png",r:"r",m:"Cáo Cam mách nhỏ: có người đang nhớ Công chúa lắm đó."},
{n:"Gấu Trúc",file:"panda.png",r:"r",m:"Gấu Trúc tặng Công chúa một trái tim tròn tròn."},
{n:"Cá Voi",file:"whale.png",r:"r",m:"Cá Voi phun một trái tim nước cho Công chúa!"},
{n:"Cáo Chín Đuôi",file:"ninetail.png",r:"r",m:"Cáo Chín Đuôi thì thầm điều ước của Công chúa."},
{n:"Kỳ Lân",file:"unicorn.png",r:"r",m:"Kỳ Lân rắc ít bụi sao lên tóc Công chúa!"},
{n:"Cupid",file:"cupid.png",r:"r",m:"Cupid bắn một mũi tên ngọt cho Công chúa!"},
{n:"Toothless",file:"Toothless.png",r:"s",m:"Toothless cạ đầu vào Công chúa rồi khịt một tiếng."},
{n:"Capy Bí Mật",file:"capybara.png",r:"s",m:CONFIG.secretMsg}];
const RL={c:"★ Thường",r:"★★ Hiếm",s:"★★★ Bí mật"};
const $=i=>document.getElementById(i),nm=s=>s.replace(/\{n\}/g,CONFIG.name);
let save={};try{save=JSON.parse(localStorage.getItem("gachaClawPets")||"{}")}catch(e){}
const store=()=>{try{localStorage.setItem("gachaClawPets",JSON.stringify(save))}catch(e){}};
const have=()=>CH.filter((c,i)=>save[i]).length;

/* ====== Âm thanh ====== */
let A,mu=0,bgMusic=null;
function tone(f,d=.1,ty="sine",v=.07,t0=0,f2){if(mu)return;try{A=A||new(window.AudioContext||window.webkitAudioContext)();const o=A.createOscillator(),g=A.createGain(),t=A.currentTime+t0;o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(A.destination);o.start(t);o.stop(t+d)}catch(e){}}
const jingle=a=>a.forEach((f,i)=>tone(f,.2,"triangle",.08,i*.11));
function setupMusic(){
 if(!bgMusic){
  bgMusic=new Audio(encodeURI("music/2-23 AM - しゃろう.mp3"));
  bgMusic.loop=true;
  bgMusic.volume=.35;
  bgMusic.preload="auto";
 }
 if(mu){
  bgMusic.pause();
  return;
 }
 bgMusic.play().catch(()=>{});
}


function shade(hex,n){
 const x=parseInt(hex.slice(1),16),f=v=>Math.max(0,Math.min(255,v+n|0));
 return "#"+[f(x>>16&255),f(x>>8&255),f(x&255)].map(v=>v.toString(16).padStart(2,"0")).join("");
}
const PET={},PETWAIT={};
function petURL(file){
  // Ảnh thú đang nằm trong thư mục "animal images" (có dấu cách), không phải folder "pets".
  return "animal%20images/" + encodeURIComponent(file);
}
function loadPets(){
 CH.forEach(ch=>{
  const im=new Image();
  im.onload=()=>{
   PET[ch.file]=im;
   (PETWAIT[ch.file]||[]).splice(0).forEach(fn=>fn());
  };
  im.onerror=()=>{console.warn("missing pet",ch.file)};
  im.src=petURL(ch.file);
 });
}
function chibi(g,x,y,R,ch){
 const im=PET[ch.file];
 if(!im){
  (PETWAIT[ch.file]||(PETWAIT[ch.file]=[])).push(()=>{if(g.canvas.isConnected)chibi(g,x,y,R,ch)});
  return;
 }
 g.imageSmoothingEnabled=false;
 const s=Math.round(R*2.15);
 g.drawImage(im,Math.round(x-s/2),Math.round(y-s*.55),s,s);
}
function drawBlinkHeart(g,x,y,size){
 const t=performance.now()/180;
 const pulse=1+Math.sin(t)*.18;
 g.clearRect(0,0,440,440);

 const glow = g.createRadialGradient(x,y,0,x,y,size*2.6);
 glow.addColorStop(0,"rgba(255,255,255,1)");
 glow.addColorStop(0.15,"rgba(255,220,232,0.95)");
 glow.addColorStop(0.35,"rgba(255,145,190,0.72)");
 glow.addColorStop(0.68,"rgba(255,96,148,0.28)");
 glow.addColorStop(1,"rgba(255,96,148,0)");
 g.fillStyle = glow;
 g.beginPath();
 g.arc(x,y,size*2.4,0,Math.PI*2);
 g.fill();

 const pattern=[
  "01100110",
  "11111111",
  "11111111",
  "01111110",
  "00111100",
  "00011000",
  "00001000"
 ];
 const cell = size / 8;
 const cx = x;
 const cy = y + 4;
 const rows = pattern.length;
 const cols = pattern[0].length;

 for(let r=0;r<rows;r++){
  for(let c=0;c<cols;c++){
   if(pattern[r][c]!=='1') continue;
   const px = cx + (c - cols/2 + 0.5) * cell * pulse;
   const py = cy + (r - rows/2 + 0.5) * cell * pulse;
   const dist = Math.hypot(px - cx, py - cy) / (size * 0.9);
   const alpha = Math.max(0.3, 1 - dist * 0.7);
   const bright = 180 + Math.sin(t*2 + r + c) * 30;
   g.fillStyle = "rgba(" + Math.round(255) + ", " + Math.round(120 + dist * 40) + ", " + Math.round(170 + bright * 0.15) + ", " + alpha + ")";
   g.fillRect(px - cell/2, py - cell/2, cell*0.95, cell*0.95);
  }
 }

 for(let i=0;i<18;i++){
  const ang = (i / 18) * Math.PI * 2 + t * 1.4;
  const len = size * (0.5 + (i % 6) * 0.16);
  const px = x + Math.cos(ang) * len;
  const py = y + Math.sin(ang) * len;
  g.fillStyle = "rgba(255,255,255," + (0.45 + (i % 4) * 0.12) + ")";
  g.fillRect(px - 2, py - 2, 4, 4);
 }
}
const capCache={};
function cap(g,x,y,c,r){
 r=r||24;
 const p=Math.max(2,Math.round(r/10)),key=c+"|"+r;
 let sprC=capCache[key];
 if(!sprC){
  const d=(r+p)*2;
  sprC=document.createElement("canvas");sprC.width=sprC.height=d;
  const z=sprC.getContext("2d"),cx=d/2,cy=d/2,blue=c==="#3f8fd8",dark=blue?"#2f6eae":shade(c,-32),edge="#5a3a4a";
  for(let py=-r;py<r;py+=p)for(let px=-r;px<r;px+=p){
   const qx=px+p*.5,qy=py+p*.5;
   if(qx*qx+qy*qy>r*r)continue;
   const rim=qx*qx+qy*qy>(r-p*1.15)*(r-p*1.15);
   let col=rim?edge:(qy<0?c:"#fffdf8");
   if(!rim&&qy<0&&qx>r*.18)col=dark;
   if(!rim&&qy>r*.2&&qx>r*.15)col=blue?"#d7ecff":"#f1e2e8";
   z.fillStyle=col;z.fillRect(cx+px,cy+py,p,p);
  }
  z.fillStyle=edge;z.fillRect(cx-r+p,cy-Math.ceil(p/2),r*2-p*2,p);
  z.fillStyle="#fff";z.fillRect(cx-p,cy-Math.ceil(p/2),p*2,p);
  z.fillRect(cx-Math.round(r*.45),cy-Math.round(r*.5),p,p);
  z.fillRect(cx-Math.round(r*.45)+p,cy-Math.round(r*.5),p,p);
  capCache[key]=sprC;
 }
 g.imageSmoothingEnabled=false;
 g.drawImage(sprC,Math.round(x-sprC.width/2),Math.round(y-sprC.height/2));
}

/* ====== Máy gắp chính diện, sàn có chiều sâu ====== */
const cv=$("cv"),X=cv.getContext("2d");X.scale(2,2);X.imageSmoothingEnabled=false;

function clawArm(kx,ky,o,s){
 const spread=12+o*20;
 for(let i=0;i<=8;i++){
  const t=i/8;
  const hook=t>.72?(t-.72)/.28*(10*(1-o*.45)):0;
  const x=kx+s*(spread*Math.sin(t*1.25)-hook);
  const y=ky-12+t*42;
  blot(x-5,y-3,10,8,"#5e6872");
  blot(x-4,y-2,8,5,"#d5dee8");
  blot(x-s*3,y-1,3,4,"#f4f8fc");
  if(i===3){
   blot(x+s*3,y-4,8,8,"#e39b12");
   blot(x+s*4,y-3,5,4,"#ffe08a");
  }
  if(i===8)blot(x-4,y+4,9,5,"#8d97a3");
 }
}
function cuteBall(x,y,r,col){
 const blue=col==="#3f8fd8";
 const sh=blue?"#2f6eae":shade(col,-22),hi=blue?"#d7ecff":"#fff",edge="#5a3a4a";
 for(let py=-r;py<=r;py+=2)for(let px=-r;px<=r;px+=2){
  if(px*px+py*py>r*r)continue;
  const rim=px*px+py*py>(r-2)*(r-2);
  let c=col;
  if(rim)c=edge;
  else if(px<-r*.42&&py<-r*.42)c=hi;
  else if(py>r*.48&&px>r*.12)c=sh;
  X.fillStyle=c;X.fillRect(x+px,y+py,2,2);
 }
 if(r>=9){
  const e=Math.max(2,(r/6)|0);
  X.fillStyle="#4a3040";
  X.fillRect(x-r*.38,y-r*.08,e,e+1);
  X.fillRect(x+r*.16,y-r*.08,e,e+1);
  X.fillStyle=blue?"#8ec4f2":"#ffb0c6";
  X.fillRect(x-r*.62,y+r*.2,e+2,e);
  X.fillRect(x+r*.32,y+r*.2,e+2,e);
 }
}

function upd(dt){

  cx=clamp(cx+dirX*46*dt,12,88);
  cz=PLAY_Z;
 }else if(st==="down"){
  open=1;cy-=110*dt;
  if(cy<=tgt){cy=tgt;st="close";tm=0;tone(300,.25,"sine",.06,0,500)}
 }else if(st==="close"){
  tm+=dt;open=Math.max(0,1-tm/.45);
  if(tm>.5){
   if(cand){cand.f=3;held=cand;if(!ok)tone(220,.2,"square",.04)}
   st="up";
  }
 }else if(st==="up"){
  cy+=100*dt;
  if(held&&!ok&&cy>tgt+28){
   held.f=1;held.vy=0;held=null;cand=null;note="fall";
   say("Ối, rơi mất rồi! Thử lại nhé");
   tone(400,.3,"sine",.06,0,150);
  }
  if(cy>=HOME){
   cy=HOME;
   if(held)st="move";
   else{
    st="idle";busy=false;
    if(note==="miss")say("Trượt rồi, căn càng cho khớp viên quà nhé!");
    note="";
   }
  }
 }else if(st==="move"){
  open=0;
  cx+=Math.sign(CHX-cx)*Math.min(55*dt,Math.abs(CHX-cx));
  cz+=Math.sign(CHZ-cz)*Math.min(55*dt,Math.abs(CHZ-cz));
  if(Math.abs(CHX-cx)<1&&Math.abs(CHZ-cz)<1){cx=CHX;cz=CHZ;st="rel";tm=0}
 }else if(st==="rel"){
  tm+=dt;open=Math.min(1,tm/.32);
  if(held&&tm>.34){held.f=2;held.vy=0;held.h=cy-GRIP;held=null}
 }
 for(const c of caps){
  if(c.f===3){c.x=cx;c.z=cz;c.h=cy-GRIP}
  else if(c.f===1){
   c.vy+=70*dt;c.h-=c.vy*dt;
   c.x+=(c.hx-c.x)*Math.min(1,7*dt);
   c.z+=(c.hz-c.z)*Math.min(1,7*dt);
   if(c.h<=c.homeH){c.h=c.homeH;c.x=c.hx;c.z=c.hz;c.vy=0;c.f=0;tone(180,.08,"sine",.05)}
  }else if(c.f===2){
   if(c.h>-110){
    c.vy+=160*dt;c.h-=c.vy*dt;
    c.x+=(CHX-c.x)*Math.min(1,10*dt);
    c.z+=(CHZ-c.z)*Math.min(1,10*dt);
    if(c.h<=-110){c.h=-110;c.vy=0;c.t=0;tone(520,.1,"triangle")}
   }else{
    c.t=(c.t||0)+dt;
    if(c.t>.45){
     const col=c.c;c.f=0;c.x=c.hx;c.z=c.hz;c.h=c.homeH;c.vy=0;c.t=0;c.c=BALLS[(Math.random()*BALLS.length)|0];
     st="idle";cx=50;cz=PLAY_Z;open=1;reveal(pick(),col);
    }
   }
  }
 }
}

function hold(btn,val){
 const on=e=>{e.preventDefault();dirX=val;try{btn.setPointerCapture(e.pointerId)}catch(err){}};
 const off=()=>{if(dirX===val)dirX=0};
 btn.addEventListener("pointerdown",on);
 btn.addEventListener("pointerup",off);
 btn.addEventListener("pointercancel",off);
}

addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
 if(e.key==="ArrowLeft")dirX=-1;
 if(e.key==="ArrowRight")dirX=1;
 if((e.key===" "||e.key==="Enter")&&!e.repeat)grab();
});
addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"&&dirX<0)dirX=0;
 if(e.key==="ArrowRight"&&dirX>0)dirX=0;
});
